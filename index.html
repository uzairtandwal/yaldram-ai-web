  <body>
    <div id="root"></div>
    <script>
      // Safe dynamic replacement script
      const observer = new MutationObserver((mutations) => {
        // Disconnect to prevent infinite loops when we modify the DOM
        observer.disconnect();
        
        mutations.forEach((mutation) => {
          if (mutation.type === 'childList' || mutation.type === 'characterData') {
            replaceText(mutation.target);
          }
        });
        
        // Reconnect after we are done
        startObserving();
      });

      function replaceText(node) {
        if (!node) return;
        
        if (node.nodeType === Node.TEXT_NODE) {
          let text = node.textContent;
          let changed = false;
          
          if (/Mufti Hassan Raza Yaldram/i.test(text)) {
            text = text.replace(/Mufti Hassan Raza Yaldram/gi, 'Mufti Hassan Raza Yaldram');
            changed = true;
          }
          if (/Yaldram AI/i.test(text)) {
            text = text.replace(/Yaldram AI/gi, 'Yaldram AI');
            changed = true;
          }
          if (/Yaldram/i.test(text) && !text.includes('Yaldram')) {
            text = text.replace(/Yaldram/gi, 'Yaldram');
            changed = true;
          }
          
          // Paragraph rewrites
          if (text.includes('draws its knowledge from the extensive video library')) {
            text = text.replace(/.*draws its knowledge from the extensive video library.*/gi, 
              'Yaldram AI is powered by the complete video collection of Mufti Hassan Raza Yaldram. As a prominent Islamic scholar, he provides detailed explanations of the Quran, Hadith, Fiqh, and Islamic history. The platform covers a wide range of subjects including Tafseer, Seerah, and modern day issues.');
            changed = true;
          }
          
          if (text.includes('Every answer references the exact') && text.includes('timestamp')) {
            text = text.replace(/.*Every answer references the exact.*/gi, 
              'Whenever you ask a question, you get an accurate answer along with the exact video timestamp. This allows you to directly watch Mufti Hassan Raza Yaldram\'s original clip, ensuring 100% authentic knowledge and full context.');
            changed = true;
          }

          if (text.includes('Get instant answers with exact video timestamps')) {
            text = text.replace(/Get instant answers with exact video timestamps from.*/gi, 
              'Find quick and accurate answers with direct video timestamps from Mufti Hassan Raza Yaldram\'s complete lectures on Quran, Hadith, Fiqh, and History. Start chatting here or on WhatsApp.');
            changed = true;
          }

          if (changed) {
            node.textContent = text;
          }
        } 
        else if (node.nodeType === Node.ELEMENT_NODE) {
          
          // Replace WhatsApp Links
          if (node.tagName === 'A' && node.href) {
            if ((node.href.includes('wa.me') || node.href.includes('whatsapp.com')) && !node.href.includes('923098387007')) {
               node.href = 'https://wa.me/923098387007';
            }
          }

          // Replace Images
          if (node.tagName === 'IMG') {
            let altText = node.alt ? node.alt.toLowerCase() : '';
            let srcText = node.src ? node.src.toLowerCase() : '';
            
            if (node.alt) {
              if (/Mufti Hassan Raza Yaldram/i.test(node.alt)) {
                node.alt = node.alt.replace(/Mufti Hassan Raza Yaldram/gi, 'Mufti Hassan Raza Yaldram');
              }
              if (/Yaldram AI/i.test(node.alt)) {
                node.alt = node.alt.replace(/Yaldram AI/gi, 'Yaldram AI');
              }
            }

            if ((srcText.includes('whatsapp') || altText.includes('whatsapp')) && !srcText.includes('whatsapp-bot.png')) {
                node.src = 'whatsapp-bot.png'; 
            }
            else if ((altText.includes('engineer') || altText.includes('mirza') || altText.includes('hassan raza yaldram') || altText.includes('profile')) && !srcText.includes('hero-profile.jpg')) {
                node.src = 'hero-profile.jpg';
            }
          }

          // Replace YouTube Video (Iframe)
          if (node.tagName === 'IFRAME') {
            if (node.src && node.src.includes('youtube.com') && !node.src.includes('jEgdFJJB_Ko')) {
               node.src = 'https://www.youtube.com/embed/jEgdFJJB_Ko'; 
            }
          }
          
          node.childNodes.forEach(replaceText);
        }
      }

      function startObserving() {
        observer.observe(document, {
          childList: true,
          subtree: true,
          characterData: true,
          attributes: true,
          attributeFilter: ['src', 'href', 'alt']
        });
      }
      
      startObserving();
    </script>
